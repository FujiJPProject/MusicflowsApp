# 起動するコンテナの定義
services:
 # Postgresコンテナ (PostgreSQL 16)
  postgres:
    image: postgres:16
    container_name: music-app-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: music_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d music_app"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - music-app-network

  # Flociコンテナ(AWSローカルエミュレーター)
  floci:
    # ready.d 内で AWS CLI を利用するため compat イメージを使用
    image: floci/floci:latest-compat
    container_name: music-app-floci
    ports:
      - "4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-northeast-1
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "120"

      # AWS CLI / Lambda 実行コンテナが利用するローカル設定
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      # 初期化スクリプトで利用する共通値
      PROJECT_NAME: music-app
      ENVIRONMENT: local
    volumes:
      # Floci の状態保存用ボリューム
      - floci_data:/app/data

      # 起動後に自動実行するスクリプトをマウント
      - ./floci/init/ready.d:/etc/floci/init/ready.d:ro

      # React が読み込むランタイム設定の出力先
      - ./frontend/public/config:/app/export/frontend-config

      # Lambda 実行用コンテナを Floci から起動するために必要
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - music-app-network

volumes:
  postgres_data:
  floci_data:

networks:
  music-app-network:
    name: music-app-network