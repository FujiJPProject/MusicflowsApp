# 起動するコンテナの定義
services:
 # Postgresコンテナ (PostgreSQL 16)
  postgres:
    image: postgres:16
    container_name: music-app-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: music_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d music_app"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - music-app-network

  # Flociコンテナ(AWSローカルエミュレーター)
  floci:
    # ready.d 内で AWS CLI を利用するため compat イメージを使用
    image: floci/floci:latest-compat
    container_name: music-app-floci
    user: root
    privileged: true # Docker-in-Docker を利用するために必要
    ports:
      - "4566:4566"
    environment:
      FLOCI_DEFAULT_REGION: ap-northeast-1
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "120"

       # --------------------------------------------------------
       # ブラウザからFlociへアクセスするためのCORS設定
       # React開発サーバー http://localhost:5173 を許可する
       # --------------------------------------------------------
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_ORIGINS: http://localhost:5173

       # Authorizationは今後Cognito/JWTを利用するため含めておく
      FLOCI_SECURITY_EXTRA_CORS_ALLOWED_HEADERS: Content-Type,Authorization

      # AWS CLI / Lambda 実行コンテナが利用するローカル設定
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

      # Spring Boot LambdaからDBへ接続するために合わせる
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: music_app
      DB_USERNAME: app_user
      DB_PASSWORD: app_password

      # 初期化スクリプトで利用する共通値
      PROJECT_NAME: music-app
      ENVIRONMENT: local

      # React開発サーバーのCORS許可用
      FRONTEND_ORIGIN: http://localhost:5173

    volumes:
      # Floci の状態保存用ボリューム
      - floci_data:/app/data

      # 起動後に自動実行するスクリプトをマウント
      - ./floci/init/ready.d:/etc/floci/init/ready.d:ro

      # React が読み込むランタイム設定の出力先
      - ./frontend/public/config:/app/export/frontend-config

      # Lambda 実行用コンテナを Floci から起動するために必要
      - /var/run/docker.sock:/var/run/docker.sock

      # Spring Boot Lambdaの成果物をFloci初期化スクリプトから参照する
      - ./backend/build/distributions:/app/lambda/springboot

    # Flociが完全に起動してからFlociコンテナを起動するための依存関係
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - music-app-network

  # React開発サーバーコンテナ
  frontend:
      build:
        context: .
        dockerfile: docker/frontend/Dockerfile.dev
      container_name: music-app-frontend
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/app
        - frontend_node_modules:/app/node_modules
      depends_on:
      - floci
      networks:
        - music-app-network
    
  # Spring Boot開発サーバーコンテナ
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    container_name: music-app-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - gradle_cache:/home/gradle/.gradle
    working_dir: /app
    environment:
      SPRING_PROFILES_ACTIVE: local
      SECURITY_ENABLED: "false"
      FRONTEND_ORIGIN: http://localhost:5173
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: music_app
      DB_USERNAME: app_user
      DB_PASSWORD: app_password
      AWS_REGION: ap-northeast-1
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started
    networks:
      - music-app-network

volumes:
  postgres_data:
  floci_data:
  frontend_node_modules:
  gradle_cache:

networks:
  music-app-network:
    name: music-app-network